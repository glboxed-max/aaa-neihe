# ===== 说明：内核模块版本检查绕过（bypass） =====
# 来源：WildKernels/GKI_KernelSU_SUSFS 的 actions/bypass-kernel
# 作用：把 kernel/module.c（或 6.1+ 的 kernel/module/version.c）里 bad_version 分支的
#       `return 0;` 改成 `return 1;`，让本会被版本校验拒绝的模块仍能加载。
# 风险：属于“绕过校验”，默认由上层开关控制，谨慎使用。
name: 内核版本检查绕过（bypass）
description: 将模块版本校验的 bad_version 分支改为 return 1（默认关闭，谨慎使用）
inputs:
  version:
    description: 内核配置版本（如 android14-6.1）
    required: true

runs:
  using: composite
  steps:
    - name: 应用 bypass 补丁
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # 6.1 / 6.6 / 6.12 的版本校验在 kernel/module/version.c，其余在 kernel/module.c
        if [[ "${{ inputs.version }}" == "android14-6.1" \
           || "${{ inputs.version }}" == "android15-6.6" \
           || "${{ inputs.version }}" == "android16-6.12" ]]; then
          TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module/version.c"
        else
          TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module.c"
        fi

        [ -f "$TARGET_FILE" ] || { echo "::error::未找到 $TARGET_FILE"; exit 1; }

        # bad_version: 之后的第一个 return 0; 改为 return 1;
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "::error::bypass 失败：bad_version: 后未找到 return 1;"
          grep -A 10 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi
        echo "已对 $TARGET_FILE 应用 bypass"

# ===== 说明：安装并配置 ccache（构建缓存加速） =====
# 来源：WildKernels/GKI_KernelSU_SUSFS 的 actions/cache-ccache-setup
# 说明：ccache 二进制取自 WildKernels/kernel_patches 的 ccache/ccache-x86-64，
#       环境变量与上游一致；缓存目录的 restore/save 由 workflow 里的 actions/cache 负责。
name: 安装并配置 ccache
description: 安装 ccache 并写入与上游一致的 CCACHE_* 环境变量

runs:
  using: composite
  steps:
    - name: 安装 ccache 并写配置
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        if ! command -v ccache >/dev/null 2>&1; then
          echo "下载 ccache 二进制（kernel_patches 提供）..."
          curl -LfsS --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
            -H "User-Agent: Mozilla/5.0" \
            "https://github.com/WildKernels/kernel_patches/raw/refs/heads/main/ccache/ccache-x86-64" -o ccache \
            || { echo "::warning::ccache 下载失败，跳过 ccache"; exit 0; }
          sudo cp -f ./ccache /usr/bin/ccache
          sudo chmod +x /usr/bin/ccache
          rm -f ./ccache
        fi

        if ! /usr/bin/ccache --version >/dev/null 2>&1; then
          echo "::warning::ccache 不可用，跳过"
          exit 0
        fi
        echo "ccache: $(/usr/bin/ccache --version | head -1)"

        {
          echo "CCACHE_DIR=/home/runner/.ccache"
          echo "CCACHE_MAXSIZE=12G"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_BASEDIR=${{ github.workspace }}"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_IGNOREOPTIONS=--sysroot*"
          echo "CCACHE_COMPRESSION=true"
          echo "CCACHE_COMPRESSLEVEL=3"
          echo "CCACHE_DIRECT=true"
          echo "CCACHE_FILE_CLONE=true"
          echo "CCACHE_INODE_CACHE=true"
          echo "CCACHE_IS_KERNEL_COMPILING=true"
          echo "CCACHE_UMASK=002"
          echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
        } >> "$GITHUB_ENV"
        mkdir -p /home/runner/.ccache

        if ccache --help 2>&1 | grep -q 'depend_mode'; then
          echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
        fi

        echo "=== ccache 配置 ==="
        ccache -p || true
        echo "[+] ccache 就绪"

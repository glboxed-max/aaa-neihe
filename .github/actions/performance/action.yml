# ===== 说明：应用性能优化补丁 =====
# 来源：WildKernels/GKI_KernelSU_SUSFS 的 actions/performance + WildKernels/kernel_patches/common/*
# 版本对应：部分补丁对内核版本有分支处理（optimise_memcmp / clear_page_16bytes_align 等）
# 容错策略：单个补丁失败只告警，不中断整条构建（便于大矩阵跑通）
inputs:
  kernel_version:
    description: 内核版本（如 6.1）
    required: true

runs:
  using: composite
  steps:
    - name: 应用性能补丁
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        P="${{ github.workspace }}/kernel_patches/common"
        [ -d "$P" ] || { echo "::warning::未找到 $P，跳过性能补丁"; exit 0; }

        # 通用补丁应用（失败只告警）
        apply() {
          local name="$1"
          [ -f "$P/$name" ] || { echo "::warning::补丁不存在: $name"; return 0; }
          printf '应用 %s ... ' "$name"
          if patch -p1 -F3 --forward < "$P/$name" >/dev/null 2>&1; then
            echo "OK"
          else
            echo "::warning::补丁失败(可能已应用/版本不符): $name"
          fi
        }

        # ---------- 基础内存/缓存优化 ----------
        apply optimized_mem_operations.patch
        apply file_struct_8bytes_align.patch
        apply reduce_cache_pressure.patch
        apply mem_opt_prefetch.patch

        # ---------- optimise_memcmp：按内核版本分支 ----------
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "5.16" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          apply optimise_memcmp.patch
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          echo "内核 $KERNEL_VERSION：用 sed 变换后应用 optimise_memcmp"
          sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' \
              -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' \
              -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' \
              "$P/optimise_memcmp.patch" | patch -p1 -F3 --forward \
            || echo "::warning::optimise_memcmp(变换后) 失败"
        else
          echo "内核 $KERNEL_VERSION < 5.11，跳过 optimise_memcmp"
        fi

        # ---------- 其余通用补丁 ----------
        apply minimise_wakeup_time.patch
        apply int_sqrt.patch
        apply reduce_gc_thread_sleep_time.patch
        apply add_timeout_wakelocks_globally.patch
        apply f2fs_reduce_congestion.patch
        apply reduce_freeze_timeout.patch

        # ---------- clear_page_16bytes_align：按内核版本分支 ----------
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "5.16" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          apply clear_page_16bytes_align.patch
        else
          echo "内核 $KERNEL_VERSION > 5.16：用 sed 变换后应用 clear_page_16bytes_align"
          cat "$P/clear_page_16bytes_align.patch" \
            | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' \
            | patch -p1 -F3 --forward \
            || echo "::warning::clear_page_16bytes_align(变换后) 失败"
        fi

        # ---------- avoid_extra_s2idle_wake_attempts：先去掉旧的 suspend_abort_fs_sync 调用 ----------
        FILE="drivers/base/power/wakeup.c"
        if [ -f "$FILE" ] && grep -q "^void pm_system_wakeup(void)" "$FILE"; then
          if sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
            sed -i '/^void pm_system_wakeup(void)/,/^}/{ /suspend_abort_fs_sync();/d }' "$FILE"
          fi
        fi
        apply avoid_extra_s2idle_wake_attempts.patch

        # ---------- 其余 f2fs / ext4 / 网络 / PCI / 日志降噪 ----------
        apply disable_cache_hot_buddy.patch
        apply f2fs_enlarge_min_fsync_blocks.patch
        apply increase_ext4_default_commit_age.patch
        apply increase_sk_mem_packets.patch
        apply reduce_pci_pme_wakeups.patch
        apply silence_irq_cpu_logspam.patch
        apply silence_system_logspam.patch

        echo "[+] 性能补丁处理完成"

# ===== 说明：向 gki_defconfig 追加/覆盖 Kconfig 选项 =====
name: 设置内核配置
description: 幂等地向 gki_defconfig 追加或覆盖配置项（存在则替换，不存在则追加）

inputs:
  config_list:
    description: 每行一条 Kconfig/defconfig 片段，例如 CONFIG_FOO=y
    required: true

runs:
  using: composite
  steps:
    - name: 修改 gki_defconfig
      shell: bash
      env:
        CONFIG_LIST: ${{ inputs.config_list }}
      run: |
        set -euo pipefail

        : "${KERNEL_ROOT:?KERNEL_ROOT 未设置，请先运行 setup-env}"
        cd "$KERNEL_ROOT/common"

        DEFCONFIG="arch/arm64/configs/gki_defconfig"
        if [ ! -f "$DEFCONFIG" ]; then
          echo "::error::未找到 gki_defconfig: $(pwd)/$DEFCONFIG"
          exit 1
        fi

        # Kleaf 会校验 fragment 里的符号必须在 Kconfig 中声明；
        # 不同内核版本声明的符号不同（如 6.1 无 NETFS_SUPPORT），
        # 这里先收集全部已声明符号，未声明的直接跳过并告警，避免整条构建失败。
        DECLARED="$(grep -rhoE '^[[:space:]]*(menu)?config[[:space:]]+[A-Za-z0-9_]+' --include='Kconfig*' . 2>/dev/null | awk '{print $NF}' | sort -u || true)"
        echo "Kconfig 已声明符号数: $(printf '%s\n' "$DECLARED" | grep -c . || true)"

        apply_line() {
          local line="$1"
          line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [[ -z "$line" || "$line" == \#* ]] && return

          local key value
          if [[ "$line" == *"="* ]]; then
            key="${line%%=*}"
            value="${line#*=}"
          else
            key="$line"
            value="y"
          fi

          # 跳过 Kconfig 未声明的符号（DECLARED 为空说明探测失败，则不过滤）
          local sym="${key#CONFIG_}"
          if [ -n "$DECLARED" ] && ! printf '%s\n' "$DECLARED" | grep -qx "$sym"; then
            echo "::warning::Kconfig 未声明 ${key}，跳过"
            return
          fi

          if grep -q "^${key}=" "$DEFCONFIG"; then
            sed -i "s|^${key}=.*|${key}=${value}|g" "$DEFCONFIG"
          elif grep -q "^# ${key} is not set" "$DEFCONFIG"; then
            sed -i "s|^# ${key} is not set|${key}=${value}|g" "$DEFCONFIG"
          else
            echo "${key}=${value}" >> "$DEFCONFIG"
          fi
          echo "  ${key}=${value}"
        }

        while IFS= read -r line || [ -n "$line" ]; do
          apply_line "$line"
        done <<< "$CONFIG_LIST"

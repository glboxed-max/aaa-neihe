name: Apply Networking Enhancements
description: 启用 IPSet/防火墙、BBR 拥塞控制、qdisc、WireGuard、CIFS 等网络增强配置

inputs:
  android_version:
    required: true
  kernel_version:
    required: true

runs:
  using: composite
  steps:
    - name: Enable IP Set & firewall configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NET_ACT_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y

    - name: Enable TCP congestion control (BBR) configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_WIREGUARD=y

    - name: Keep tcp_bic built-in (avoid unlisted module)
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_ROOT/common"
        DEF="$DEFCONFIG"
        if grep -qE '^config TCP_CONG_BIC$' net/ipv4/Kconfig; then
          if grep -qE '^CONFIG_TCP_CONG_BIC=' "$DEF"; then
            sed -i -E 's|^CONFIG_TCP_CONG_BIC=.*|CONFIG_TCP_CONG_BIC=y|' "$DEF"
          elif grep -qE '^# CONFIG_TCP_CONG_BIC is not set' "$DEF"; then
            sed -i -E 's|^# CONFIG_TCP_CONG_BIC is not set|CONFIG_TCP_CONG_BIC=y|' "$DEF"
          else
            echo 'CONFIG_TCP_CONG_BIC=y' >> "$DEF"
          fi
          echo "已内建 CONFIG_TCP_CONG_BIC=y（避免 tcp_bic.ko 未列入 module_outs）"
        fi

    - name: Patch 5.10 ip_set max
      if: inputs.kernel_version == '5.10'
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        if [ -f net/netfilter/ipset/ip_set_core.c ]; then
          sed -i 's/CONFIG_IP_SET_MAX/65534/g' net/netfilter/ipset/ip_set_core.c
        fi

    - name: Enable CIFS configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_CIFS=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y

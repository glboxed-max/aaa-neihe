name: 管理器源码构建

# ============================================================
#  从源码用 Gradle 构建 KSU 管理器 APK（对齐 SukiSU 官方 build-manager.yml）
#
#  关键点：
#   - applicationId 通过 -PKSU_PACKAGE_NAME=<包名> 指定；
#     namespace / 类包名保持 com.sukisu.ultra 不变 -> JNI 符号 Java_com_sukisu_ultra_* 不受影响（不会闪退）。
#   - libksud.so：优先从源码编译 ksud（同一 commit，版本对应）；
#     失败则回退到从官方 Release 的 APK 中提取（保证仍可构建）。
#   - 用仓库内置固定 keystore 签名 -> 与内核注入的 size/hash 配对，跨运行可拿 root。
#   - 产物：<包名>.apk + manager-info.env，并发布到 Release（tag: manager-<变体>-<短sha>）。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KSU 变体"
        required: true
        type: choice
        options: [SukiSU, ReSukiSU, Official, Next]
        default: SukiSU
      ksu_ref:
        description: "分支 / Tag / commit（留空 = 默认分支）"
        required: false
        type: string
        default: ""
      package:
        description: "管理器包名（applicationId）"
        required: true
        type: string
        default: "w.fkiu"
      manager_name:
        description: "管理器显示名"
        required: false
        type: string
        default: "aaa-neihe"
      build_ksud:
        description: "从源码编译 ksud（更严格的版本对应；关则从官方 APK 提取 libksud.so）"
        required: false
        type: boolean
        default: true
      publish_release:
        description: "发布到 Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-manager:
    name: "${{ inputs.ksu_variant }} -> ${{ inputs.package }}"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析变体仓库
        id: var
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.ksu_variant }}" in
            SukiSU)   REPO="SukiSU-Ultra/SukiSU-Ultra"; DIR="SukiSU" ;;
            ReSukiSU) REPO="ReSukiSU/ReSukiSU";         DIR="ReSukiSU" ;;
            Official) REPO="tiann/KernelSU";            DIR="KernelSU" ;;
            Next)     REPO="KernelSU-Next/KernelSU-Next"; DIR="KernelSU-Next" ;;
            *) echo "::error::不支持的变体 ${{ inputs.ksu_variant }}"; exit 1 ;;
          esac
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: 克隆 KSU 源码（对应版本）
        id: clone
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ steps.var.outputs.repo }}"
          DIR="${{ steps.var.outputs.dir }}"
          REF="${{ inputs.ksu_ref }}"

          git clone --filter=blob:none --single-branch "https://github.com/$REPO.git" "$DIR"
          if [ -n "$REF" ]; then
            cd "$DIR"
            if git rev-parse --verify --quiet "origin/$REF" >/dev/null; then
              git checkout "$REF"
            elif git rev-parse --verify --quiet "refs/tags/$REF" >/dev/null; then
              git checkout "refs/tags/$REF"
            else
              git fetch --filter=blob:none origin "$REF"
              git checkout FETCH_HEAD
            fi
            cd ..
          fi

          COMMIT="$(git -C "$DIR" rev-parse HEAD)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%.12s' "$COMMIT")" >> "$GITHUB_OUTPUT"
          echo "已选 $REPO @ $COMMIT"

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装平台 / build-tools / NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # 具体版本以 KSU 源码 manager/build.gradle.kts 为准；装不上就交给 AGP 自动下载
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" \
            >/dev/null 2>&1 || echo "::warning::部分 SDK 组件未预装，交给 AGP 自动下载"

      - name: 安装 NDK r29（供 ksud 交叉编译）
        if: inputs.build_ksud
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: 从源码编译 ksud（同 commit）
        if: inputs.build_ksud
        id: ksud
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.var.outputs.dir }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: ${{ inputs.package }}
        run: |
          set -euo pipefail
          rustup update stable || true
          for T in aarch64-linux-android x86_64-linux-android armv7-linux-androideabi; do
            rustup target add "$T" || true
          done
          for T in aarch64-linux-android x86_64-linux-android armv7-linux-androideabi; do
            echo "==== 编译 ksud for $T ===="
            source .github/scripts/setup-rust-build.sh "$T" 26
            cargo build --target "$T" --release --manifest-path ./userspace/ksud/Cargo.toml
          done
          echo "ksud 编译完成"

      - name: 准备 libksud.so
        id: libksud
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.var.outputs.dir }}"
          JNI="$DIR/manager/app/src/main/jniLibs"
          mkdir -p "$JNI/arm64-v8a" "$JNI/armeabi-v7a" "$JNI/x86_64"

          ok=0
          if [ "${{ inputs.build_ksud }}" = "true" ] && [ -f "$DIR/target/aarch64-linux-android/release/ksud" ]; then
            cp -f "$DIR/target/aarch64-linux-android/release/ksud" "$JNI/arm64-v8a/libksud.so"
            [ -f "$DIR/target/x86_64-linux-android/release/ksud" ]  && cp -f "$DIR/target/x86_64-linux-android/release/ksud"  "$JNI/x86_64/libksud.so" || true
            [ -f "$DIR/target/armv7-linux-androideabi/release/ksud" ] && cp -f "$DIR/target/armv7-linux-androideabi/release/ksud" "$JNI/armeabi-v7a/libksud.so" || true
            ok=1
            echo "✅ 使用源码编译的 ksud 作为 libksud.so"
          fi

          if [ "$ok" = "0" ]; then
            echo "::warning::源码 ksud 不可用，回退到从官方 Release 的 APK 提取 libksud.so"
            REPO="${{ steps.var.outputs.repo }}"
            mkdir -p /tmp/mgr-official
            curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" -o /tmp/rel.json
            URL="$(jq -r '.assets[]? | select(.name|endswith(".apk")) | .browser_download_url' /tmp/rel.json | head -n1)"
            [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::官方 Release 未提供 APK"; exit 1; }
            curl -fsSL -o /tmp/official.apk "$URL"
            for ABI in arm64-v8a armeabi-v7a x86_64; do
              unzip -o -j /tmp/official.apk "lib/$ABI/libksud.so" -d "$JNI/$ABI" >/dev/null 2>&1 || true
            done
            ls -lh "$JNI"/*/libksud.so
          fi

      - name: 配置签名（仓库内置固定 keystore）
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.var.outputs.dir }}"
          PASS="${{ vars.MANAGER_KEYSTORE_PASS || 'android' }}"
          if [ -f "$GITHUB_WORKSPACE/.github/manager/ks.jks.b64" ]; then
            base64 -d "$GITHUB_WORKSPACE/.github/manager/ks.jks.b64" > /tmp/manager.jks
            ALIAS="k"
            echo "使用仓库内置固定 keystore"
          else
            keytool -genkeypair -keystore /tmp/manager.jks -alias k -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=${{ inputs.package }}" >/dev/null 2>&1
            ALIAS="k"
            echo "::warning::未找到内置 keystore，本次使用临时随机 keystore"
          fi
          {
            echo "KEYSTORE_FILE=/tmp/manager.jks"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$PASS"
          } >> "$DIR/manager/gradle.properties"
          # 也传给 repack_apk.py 使用
          echo "SIGN_KEYSTORE_FILE=/tmp/manager.jks" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Gradle 构建管理器（applicationId = 自定义包名）
        shell: bash
        working-directory: ${{ steps.var.outputs.dir }}/manager
        env:
          KSU_PACKAGE_NAME: ${{ inputs.package }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PKSU_PACKAGE_NAME="${{ inputs.package }}" \
            -PKSU_NAME="${{ inputs.manager_name }}"

      - name: 收集 / 校验 / 签名（必要时重签）
        id: out
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.var.outputs.dir }}"
          PKG="${{ inputs.package }}"
          OUT_APK="$PWD/$PKG.apk"

          SRC_APK="$(ls -t "$DIR"/manager/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)"
          [ -n "$SRC_APK" ] || { echo "::error::未找到 Gradle 产物"; exit 1; }
          cp "$SRC_APK" "$OUT_APK"

          # 若插件未签名（没有 v2 签名块），用 apksigner 重签
          if ! python3 "$GITHUB_WORKSPACE/.github/tools/get_apk_sign.py" "$OUT_APK" >/dev/null 2>&1; then
            echo "未检测到 v2 签名，使用 apksigner 重签"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1)"
            "$BT/zipalign" -f -p 4 "$OUT_APK" "$OUT_APK.aligned"
            "$BT/apksigner" sign --ks /tmp/manager.jks --ks-key-alias k \
              --ks-pass "pass:${{ vars.MANAGER_KEYSTORE_PASS || 'android' }}" \
              --key-pass "pass:${{ vars.MANAGER_KEYSTORE_PASS || 'android' }}" \
              --out "$OUT_APK.signed" "$OUT_APK.aligned"
            mv -f "$OUT_APK.signed" "$OUT_APK"
            rm -f "$OUT_APK.aligned"
          fi

          # 校验包名
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1)"
          BADGE="$("$BT/aapt2" dump badging "$OUT_APK" | head -n1 || true)"
          echo "badging: $BADGE"
          echo "$BADGE" | grep -q "name='$PKG'" || { echo "::error::包名不是 $PKG"; exit 1; }
          echo "✅ 包名 = $PKG"

          # 确认类包名仍是 com.sukisu.ultra（JNI 依赖），且含 libksud.so
          unzip -l "$OUT_APK" | grep -q 'lib/arm64-v8a/libksud.so' || echo "::warning::APK 内未含 libksud.so(arm64)"
          echo "✅ 已确认 libksud.so"

          SIGN="$(python3 "$GITHUB_WORKSPACE/.github/tools/get_apk_sign.py" "$OUT_APK")"
          echo "$SIGN"
          SIZE="$(printf '%s\n' "$SIGN" | sed -n 's/^SIZE=//p')"
          HASH="$(printf '%s\n' "$SIGN" | sed -n 's/^HASH=//p')"
          [ -n "$SIZE" ] && [ -n "$HASH" ] || { echo "::error::签名解析失败"; exit 1; }

          {
            echo "MANAGER_APK=$PKG.apk"
            echo "MANAGER_PACKAGE=$PKG"
            echo "MANAGER_SIZE=$SIZE"
            echo "MANAGER_HASH=$HASH"
            echo "MANAGER_KSU_COMMIT=${{ steps.clone.outputs.commit }}"
          } | tee manager-info.env
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 管理器源码-${{ inputs.ksu_variant }}-${{ inputs.package }}
          path: |
            ${{ inputs.package }}.apk
            manager-info.env
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Releases
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="manager-${{ inputs.ksu_variant }}-${{ steps.clone.outputs.short }}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ inputs.package }}.apk" manager-info.env \
            --title "管理器 ${{ inputs.ksu_variant }} ${{ inputs.package }} (${{ steps.clone.outputs.short }})" \
            --notes "源码构建的管理器（applicationId=${{ inputs.package }}，类包名保持 com.sukisu.ultra）。
          KSU commit: ${{ steps.clone.outputs.commit }}
          size/hash: ${{ steps.out.outputs.size }} ${{ steps.out.outputs.hash }}"
          echo "已发布 Release: $TAG"

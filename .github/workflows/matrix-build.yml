name: 矩阵内核构建

# ============================================================
#  一次触发，按 Android 版本扇出多个内核构建
#  每个目标调用可复用工作流 build-kernel.yml
# ============================================================

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      android_scope:
        description: "构建范围（All=全部 Android 版本）"
        required: true
        type: choice
        options: [All, android12, android13, android14, android15, android16]
        default: All
      sub_version_mode:
        description: "子版本范围"
        required: true
        type: choice
        options: ["Latest(最新可用)", "All(全部)"]
        default: "Latest(最新可用)"
      ksu_variant:
        description: "KSU 变体"
        required: true
        type: choice
        options: [SukiSU, Official, ReSukiSU, Next, None]
        default: SukiSU
      ksu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options: ["Stable(标准)", "Dev(开发)", "Latest(最新)", "Other(其他/指定)"]
        default: "Stable(标准)"
      custom_ref:
        description: "自定义管理器 分支/Tag"
        required: false
        type: string
        default: ""
      ksu_version:
        description: "强制指定 KSU_VERSION（如 13000）"
        required: false
        type: string
        default: ""
      use_susfs:
        description: "启用 SUSFS"
        required: false
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: false
        type: boolean
        default: true
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: true
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: false
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: true
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM 功能"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "各目标构建完成后发布到 Releases"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: "生成构建矩阵"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: 生成矩阵
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          SCOPE="${{ inputs.android_scope }}"
          MODE="${{ inputs.sub_version_mode }}"

          # 格式: android|kernel|sub_level|os_patch_level|revision
          # 列表参考 jiuxiao226/KernelSU-Actions 与 WildKernels/GKI_KernelSU_SUSFS
          TABLE="android12|5.10|66|2022-01|r11
          android12|5.10|81|2022-03|r11
          android12|5.10|101|2022-04|r28
          android12|5.10|110|2022-07|r1
          android12|5.10|117|2022-09|r1
          android12|5.10|136|2022-11|r15
          android12|5.10|149|2023-01|r1
          android12|5.10|160|2023-03|r1
          android12|5.10|168|2023-04|r9
          android12|5.10|177|2023-07|r3
          android12|5.10|185|2023-09|r1
          android12|5.10|198|2024-01|r17
          android12|5.10|205|2024-03|r1
          android12|5.10|209|2024-05|r13
          android12|5.10|218|2024-08|r14
          android12|5.10|226|2024-11|r8
          android12|5.10|233|2025-02|r1
          android12|5.10|236|2025-05|r1
          android12|5.10|237|2025-06|r1
          android12|5.10|240|2025-09|r1
          android12|5.10|246|2025-12|r1
          android12|5.10|X|lts|r1
          android13|5.15|74|2023-01|r1
          android13|5.15|78|2023-03|r1
          android13|5.15|94|2023-05|r1
          android13|5.15|104|2023-07|r1
          android13|5.15|119|2023-09|r1
          android13|5.15|123|2023-11|r1
          android13|5.15|137|2024-01|r1
          android13|5.15|144|2024-03|r1
          android13|5.15|148|2024-05|r1
          android13|5.15|149|2024-07|r1
          android13|5.15|151|2024-08|r1
          android13|5.15|153|2024-09|r1
          android13|5.15|167|2024-11|r1
          android13|5.15|170|2025-01|r1
          android13|5.15|178|2025-03|r1
          android13|5.15|180|2025-05|r1
          android13|5.15|185|2025-07|r1
          android13|5.15|189|2025-09|r1
          android13|5.15|194|2025-12|r1
          android13|5.15|X|lts|r1
          android14|6.1|25|2023-10|r1
          android14|6.1|43|2023-11|r1
          android14|6.1|57|2024-01|r1
          android14|6.1|68|2024-03|r1
          android14|6.1|75|2024-05|r1
          android14|6.1|78|2024-06|r1
          android14|6.1|84|2024-07|r1
          android14|6.1|90|2024-08|r1
          android14|6.1|93|2024-09|r1
          android14|6.1|99|2024-10|r1
          android14|6.1|112|2024-11|r1
          android14|6.1|115|2024-12|r1
          android14|6.1|118|2025-01|r1
          android14|6.1|124|2025-02|r1
          android14|6.1|128|2025-03|r1
          android14|6.1|129|2025-04|r1
          android14|6.1|134|2025-05|r1
          android14|6.1|138|2025-06|r1
          android14|6.1|141|2025-07|r1
          android14|6.1|145|2025-09|r1
          android14|6.1|157|2025-12|r1
          android14|6.1|162|2026-03|r1
          android14|6.1|X|lts|r1
          android15|6.6|50|2024-10|r1
          android15|6.6|56|2024-11|r1
          android15|6.6|57|2024-12|r1
          android15|6.6|58|2025-01|r1
          android15|6.6|66|2025-02|r1
          android15|6.6|77|2025-03|r1
          android15|6.6|82|2025-04|r1
          android15|6.6|87|2025-05|r1
          android15|6.6|89|2025-06|r1
          android15|6.6|92|2025-07|r1
          android15|6.6|98|2025-09|r1
          android15|6.6|102|2025-10|r1
          android15|6.6|118|2026-01|r1
          android15|6.6|X|lts|r1
          android16|6.12|23|2025-06|r1
          android16|6.12|30|2025-07|r1
          android16|6.12|38|2025-09|r1
          android16|6.12|58|2025-12|r1
          android16|6.12|X|lts|r1"

          # 选取要构建的行：Latest 模式每个版本只取 sub_level 最大的数值档（忽略 X/lts）
          if [ "$MODE" = "All(全部)" ]; then
            ROWS="$TABLE"
          else
            ROWS=""
            for A in android12 android13 android14 android15 android16; do
              R="$(echo "$TABLE" | awk -F'|' -v a="$A" '$1==a && $3 ~ /^[0-9]+$/ {print $0}' | sort -t'|' -k3,3n | tail -n1)"
              [ -n "$R" ] && ROWS="${ROWS}${R}"$'\n'
            done
          fi

          JSON="[]"
          while IFS='|' read -r A K S P R; do
            [ -z "$A" ] && continue
            [ -z "$R" ] && R=r1
            if [ "$SCOPE" != "All" ] && [ "$SCOPE" != "$A" ]; then
              continue
            fi
            JSON=$(echo "$JSON" | jq -c --arg a "$A" --arg k "$K" --arg s "$S" --arg p "$P" --arg r "$R" \
              '. + [{"android_version":$a,"kernel_version":$k,"sub_level":$s,"os_patch_level":$p,"revision":$r}]')
          done <<< "$ROWS"

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$JSON" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "将构建 $(echo "$JSON" | jq 'length') 个目标"

  build:
    name: "${{ matrix.target.android_version }}-${{ matrix.target.kernel_version }}.${{ matrix.target.sub_level }}"
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.target.android_version }}
      kernel_version: ${{ matrix.target.kernel_version }}
      sub_level: ${{ matrix.target.sub_level }}
      os_patch_level: ${{ matrix.target.os_patch_level }}
      revision: ${{ matrix.target.revision }}
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_branch: ${{ inputs.ksu_branch }}
      custom_ref: ${{ inputs.custom_ref }}
      ksu_version: ${{ inputs.ksu_version }}
      use_susfs: ${{ inputs.use_susfs }}
      use_zram: ${{ inputs.use_zram }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ""
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      use_kpm: ${{ inputs.use_kpm }}
      kpm_password: ""
      use_rekernel: ${{ inputs.use_rekernel }}
      version: ""
      build_time: ""
      custom_kernel_options: ""
      publish_release: ${{ inputs.publish_release }}

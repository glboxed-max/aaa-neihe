name: 矩阵内核构建

# ============================================================
#  一次触发，按范围扇出多个内核构建
#  版本表：.github/matrix/versions.tsv
#  每个目标调用可复用工作流 build-kernel.yml
# ============================================================

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 构建范围 ====================
      build_scope:
        description: "构建范围：全部版本 / 5系列 / 6系列 / 单独指定"
        required: true
        type: choice
        options:
          - "全部版本"
          - "5系列"
          - "6系列"
          - "单独指定"
        default: "全部版本"
      sub_version_mode:
        description: "子版本：最新子版本（每组合取最新一档）/ 全部子版本"
        required: true
        type: choice
        options:
          - "最新子版本"
          - "全部子版本"
        default: "最新子版本"

      # ==================== 单独指定（仅 build_scope=单独指定 时生效） ====================
      android_version:
        description: "单独指定：Android 版本"
        required: false
        type: choice
        options: [android12, android13, android14, android15, android16]
        default: android14
      kernel_version:
        description: "单独指定：内核版本"
        required: false
        type: choice
        options: ["5.10", "5.15", "6.1", "6.6", "6.12"]
        default: "6.1"
      sub_level:
        description: "单独指定：子版本号（如 172）"
        required: false
        type: string
        default: "172"
      os_patch_level:
        description: "单独指定：补丁级别（如 2026-06）"
        required: false
        type: string
        default: "2026-06"
      revision:
        description: "单独指定：Android 12 GKI 修订号（仅 android12 用）"
        required: false
        type: string
        default: "r1"

      # ==================== KernelSU / 管理器 ====================
      ksu_variant:
        description: "KSU 变体"
        required: true
        type: choice
        options: [SukiSU, Official, ReSukiSU, Next, None]
        default: SukiSU
      ksu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options: ["Stable(标准)", "Dev(开发)", "Latest(最新)", "Other(其他/指定)"]
        default: "Stable(标准)"
      custom_ref:
        description: "自定义管理器 分支/Tag"
        required: false
        type: string
        default: ""
      ksu_version:
        description: "强制指定 KSU_VERSION（如 13000）"
        required: false
        type: string
        default: ""

      # ==================== 功能开关 ====================
      use_susfs:
        description: "启用 SUSFS"
        required: false
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: false
        type: boolean
        default: true
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: true
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: false
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: true
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM 功能"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "各目标构建完成后发布到 Releases"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: "生成构建矩阵"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成矩阵
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          SCOPE="${{ inputs.build_scope }}"
          MODE="${{ inputs.sub_version_mode }}"
          TABLE_FILE="$GITHUB_WORKSPACE/.github/matrix/versions.tsv"

          if [ ! -f "$TABLE_FILE" ]; then
            echo "::error::未找到版本表 $TABLE_FILE"
            exit 1
          fi

          if [ "$SCOPE" = "单独指定" ]; then
            ROWS="${{ inputs.android_version }}|${{ inputs.kernel_version }}|${{ inputs.sub_level }}|${{ inputs.os_patch_level }}|${{ inputs.revision }}"
          else
            ALL="$(grep -vE '^[[:space:]]*(#|$)' "$TABLE_FILE")"

            case "$SCOPE" in
              "5系列") RE='^5\.' ;;
              "6系列") RE='^6\.' ;;
              *)       RE='.' ;;
            esac
            FILTERED="$(printf '%s\n' "$ALL" | awk -F'|' -v re="$RE" '$2 ~ re {print}')"

            if [ "$MODE" = "全部子版本" ]; then
              ROWS="$FILTERED"
            else
              ROWS=""
              while IFS= read -r KEY; do
                [ -z "$KEY" ] && continue
                A="${KEY%%|*}"; K="${KEY##*|}"
                R="$(printf '%s\n' "$FILTERED" | awk -F'|' -v a="$A" -v k="$K" \
                     '$1==a && $2==k && $3 ~ /^[0-9]+$/ {print}' | sort -t'|' -k3,3n | tail -n1)"
                [ -n "$R" ] && ROWS="${ROWS}${R}"$'\n'
              done < <(printf '%s\n' "$FILTERED" | awk -F'|' '{print $1"|"$2}' | sort -u)
            fi
          fi

          JSON="[]"
          while IFS='|' read -r A K S P R; do
            [ -z "$A" ] && continue
            [ -z "$R" ] && R=r1
            JSON=$(echo "$JSON" | jq -c --arg a "$A" --arg k "$K" --arg s "$S" --arg p "$P" --arg r "$R" \
              '. + [{"android_version":$a,"kernel_version":$k,"sub_level":$s,"os_patch_level":$p,"revision":$r}]')
          done <<< "$ROWS"

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          COUNT="$(echo "$JSON" | jq 'length')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "范围=$SCOPE 子版本=$MODE -> 目标数=$COUNT"
          echo "$JSON" | jq -r '.[] | "  \(.android_version)-\(.kernel_version).\(.sub_level)-\(.os_patch_level)"'

  build:
    name: "${{ matrix.target.android_version }}-${{ matrix.target.kernel_version }}.${{ matrix.target.sub_level }}"
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.target.android_version }}
      kernel_version: ${{ matrix.target.kernel_version }}
      sub_level: ${{ matrix.target.sub_level }}
      os_patch_level: ${{ matrix.target.os_patch_level }}
      revision: ${{ matrix.target.revision }}
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_branch: ${{ inputs.ksu_branch }}
      custom_ref: ${{ inputs.custom_ref }}
      ksu_version: ${{ inputs.ksu_version }}
      use_susfs: ${{ inputs.use_susfs }}
      use_zram: ${{ inputs.use_zram }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ""
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      use_kpm: ${{ inputs.use_kpm }}
      kpm_password: ""
      use_rekernel: ${{ inputs.use_rekernel }}
      version: ""
      build_time: ""
      custom_kernel_options: ""
      publish_release: ${{ inputs.publish_release }}

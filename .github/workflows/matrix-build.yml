name: 批量内核构建

# ============================================================
#  一次触发，按“内核版本范围”扇出多个内核构建（默认构建全部子版本）。
#  版本表：.github/matrix/versions.tsv
#  例：kernel_scope=6.1（默认全部子版本）→ 构建所有 6.1
# ============================================================

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 构建范围 ====================
      kernel_scope:
        description: "内核版本范围"
        required: true
        type: choice
        options:
          - "全部"
          - "5系列"
          - "6系列"
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "全部"
      android_scope:
        description: "Android 版本过滤（主要用于 5.x）"
        required: true
        type: choice
        options: [全部, android12, android13, android14, android15, android16]
        default: 全部
      sub_version_mode:
        description: "子版本（默认：所选范围内的全部子版本）"
        required: true
        type: choice
        options:
          - "全部子版本"
          - "最新子版本"
        default: "全部子版本"

      # ==================== KernelSU / 管理器 ====================
      ksu_variant:
        description: "KSU 变体"
        required: true
        type: choice
        options: [SukiSU, Official, ReSukiSU, Next, None]
        default: SukiSU
      ksu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options: ["Stable(标准)", "Dev(开发)", "Latest(最新)", "Other(其他/指定)"]
        default: "Stable(标准)"
      custom_ref:
        description: "自定义管理器 分支/Tag"
        required: false
        type: string
        default: ""
      ksu_version:
        description: "强制指定 KSU_VERSION（如 13000）"
        required: false
        type: string
        default: ""

      # ==================== 功能开关 ====================
      use_susfs:
        description: "启用 SUSFS"
        required: false
        type: boolean
        default: true
      susfs_commit:
        description: "SUSFS 固定提交（留空=默认 pin）"
        required: false
        type: string
        default: ""
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: false
        type: boolean
        default: true
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: true
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: false
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: true
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM 功能"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_kernel_hygiene:
        description: "内核清理：去 -dirty + 移除受保护导出/模块"
        required: false
        type: boolean
        default: true
      use_misc_configs:
        description: "启用杂项配置（OverlayFS / KALLSYMS）"
        required: false
        type: boolean
        default: true
      extra_features:
        description: "额外功能（逗号分隔）：bypass,droidspaces,nomount,btf,device_patches,ccache"
        required: false
        type: string
        default: ""
      use_performance:
        description: "应用性能优化补丁（WildKernels/kernel_patches）"
        required: false
        type: boolean
        default: false
      use_bbrv3:
        description: "应用 BBRv3 拥塞控制补丁"
        required: false
        type: boolean
        default: false
      upload_manager:
        description: "同时上传对应版本的管理器 APK"
        required: false
        type: boolean
        default: true
      manager_mode:
        description: "管理器来源：源码构建 / 重打包 / 官方"
        required: false
        type: choice
        options: ["源码构建", "重打包", "官方"]
        default: "源码构建"
      publish_release:
        description: "各目标构建完成后发布到 Releases"
        required: false
        type: boolean
        default: true

jobs:
  prepare:
    name: "生成构建矩阵"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成矩阵
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          KSCOPE="${{ inputs.kernel_scope }}"
          ASCOPE="${{ inputs.android_scope }}"
          MODE="${{ inputs.sub_version_mode }}"
          TABLE_FILE="$GITHUB_WORKSPACE/.github/matrix/versions.tsv"
          [ -f "$TABLE_FILE" ] || { echo "::error::未找到 $TABLE_FILE"; exit 1; }

          case "$KSCOPE" in
            "全部") RE='.' ;;
            "5系列") RE='^5\.' ;;
            "6系列") RE='^6\.' ;;
            "5.10") RE='^5\.10$' ;;
            "5.15") RE='^5\.15$' ;;
            "6.1")  RE='^6\.1$' ;;
            "6.6")  RE='^6\.6$' ;;
            "6.12") RE='^6\.12$' ;;
            *) echo "::error::未知 kernel_scope: $KSCOPE"; exit 1 ;;
          esac

          ALL="$(grep -vE '^[[:space:]]*(#|$)' "$TABLE_FILE")"
          FILTERED="$(printf '%s\n' "$ALL" | awk -F'|' -v re="$RE" '$2 ~ re {print}')"
          if [ "$ASCOPE" != "全部" ]; then
            FILTERED="$(printf '%s\n' "$FILTERED" | awk -F'|' -v a="$ASCOPE" '$1 == a {print}')"
          fi

          if [ "$MODE" = "全部子版本" ]; then
            ROWS="$FILTERED"
          else
            ROWS=""
            while IFS= read -r KEY; do
              [ -z "$KEY" ] && continue
              A="${KEY%%|*}"; K="${KEY##*|}"
              R="$(printf '%s\n' "$FILTERED" | awk -F'|' -v a="$A" -v k="$K" \
                   '$1==a && $2==k && $3 ~ /^[0-9]+$/ {print}' | sort -t'|' -k3,3n | tail -n1)"
              [ -n "$R" ] && ROWS="${ROWS}${R}"$'\n'
            done < <(printf '%s\n' "$FILTERED" | awk -F'|' '{print $1"|"$2}' | sort -u)
          fi

          JSON="[]"
          while IFS='|' read -r A K S P R; do
            [ -z "$A" ] && continue
            [ -z "$R" ] && R=r1
            JSON=$(echo "$JSON" | jq -c --arg a "$A" --arg k "$K" --arg s "$S" --arg p "$P" --arg r "$R" \
              '. + [{"android_version":$a,"kernel_version":$k,"sub_level":$s,"os_patch_level":$p,"revision":$r}]')
          done <<< "$ROWS"

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          COUNT="$(echo "$JSON" | jq 'length')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "内核范围=$KSCOPE Android=$ASCOPE 子版本=$MODE -> 目标数=$COUNT"
          echo "$JSON" | jq -r '.[] | "  \(.android_version)-\(.kernel_version).\(.sub_level)-\(.os_patch_level)"'

  build:
    name: "${{ matrix.target.android_version }}-${{ matrix.target.kernel_version }}.${{ matrix.target.sub_level }}"
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.target.android_version }}
      kernel_version: ${{ matrix.target.kernel_version }}
      sub_level: ${{ matrix.target.sub_level }}
      os_patch_level: ${{ matrix.target.os_patch_level }}
      revision: ${{ matrix.target.revision }}
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_branch: ${{ inputs.ksu_branch }}
      custom_ref: ${{ inputs.custom_ref }}
      ksu_version: ${{ inputs.ksu_version }}
      use_susfs: ${{ inputs.use_susfs }}
      susfs_commit: ${{ inputs.susfs_commit }}
      use_zram: ${{ inputs.use_zram }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      use_kpm: ${{ inputs.use_kpm }}
      kpm_password: ""
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kernel_hygiene: ${{ inputs.use_kernel_hygiene }}
      use_misc_configs: ${{ inputs.use_misc_configs }}
      use_ptrace: ${{ inputs.use_ptrace }}
      extra_features: ${{ inputs.extra_features }}
      use_performance: ${{ inputs.use_performance }}
      use_bbrv3: ${{ inputs.use_bbrv3 }}
      version: ""
      build_time: ""
      custom_kernel_options: ""
      publish_release: ${{ inputs.publish_release }}
      upload_manager: ${{ inputs.upload_manager }}
      manager_mode: ${{ inputs.manager_mode }}

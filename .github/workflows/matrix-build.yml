name: 矩阵内核构建

# ============================================================
#  一次触发，按 Android 版本扇出多个内核构建
#  每个目标调用可复用工作流 build-kernel.yml
# ============================================================

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      android_scope:
        description: "构建范围（All=每个 Android 版本的最新一档）"
        required: true
        type: choice
        options: [All, android12, android13, android14, android15, android16]
        default: All
      ksu_variant:
        description: "KSU 变体"
        required: true
        type: choice
        options: [SukiSU, Official, ReSukiSU, Next, None]
        default: SukiSU
      ksu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options: ["Stable(标准)", "Dev(开发)", "Latest(最新)", "Other(其他/指定)"]
        default: "Stable(标准)"
      custom_ref:
        description: "自定义管理器 分支/Tag"
        required: false
        type: string
        default: ""
      ksu_version:
        description: "强制指定 KSU_VERSION（如 13000）"
        required: false
        type: string
        default: ""
      use_susfs:
        description: "启用 SUSFS"
        required: false
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: false
        type: boolean
        default: true
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: true
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: false
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: true
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM 功能"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "各目标构建完成后发布到 Releases"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: "生成构建矩阵"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: 生成矩阵
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          SCOPE="${{ inputs.android_scope }}"

          # android|kernel|sub_level|os_patch_level（各版本最新一档，可自行增删）
          TABLE="android12|5.10|246|2025-12
          android13|5.15|194|2025-12
          android14|6.1|162|2026-03
          android15|6.6|118|2026-01
          android16|6.12|58|2025-12"

          JSON="[]"
          while IFS='|' read -r A K S P; do
            [ -z "$A" ] && continue
            if [ "$SCOPE" != "All" ] && [ "$SCOPE" != "$A" ]; then
              continue
            fi
            JSON=$(echo "$JSON" | jq -c --arg a "$A" --arg k "$K" --arg s "$S" --arg p "$P" \
              '. + [{"android_version":$a,"kernel_version":$k,"sub_level":$s,"os_patch_level":$p}]')
          done <<< "$TABLE"

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$JSON" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "将构建 $(echo "$JSON" | jq 'length') 个目标"

  build:
    name: "${{ matrix.target.android_version }}-${{ matrix.target.kernel_version }}.${{ matrix.target.sub_level }}"
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.target.android_version }}
      kernel_version: ${{ matrix.target.kernel_version }}
      sub_level: ${{ matrix.target.sub_level }}
      os_patch_level: ${{ matrix.target.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_branch: ${{ inputs.ksu_branch }}
      custom_ref: ${{ inputs.custom_ref }}
      ksu_version: ${{ inputs.ksu_version }}
      use_susfs: ${{ inputs.use_susfs }}
      use_zram: ${{ inputs.use_zram }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ""
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      use_kpm: ${{ inputs.use_kpm }}
      kpm_password: ""
      use_rekernel: ${{ inputs.use_rekernel }}
      version: ""
      build_time: ""
      custom_kernel_options: ""
      publish_release: ${{ inputs.publish_release }}
